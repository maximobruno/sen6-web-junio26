[[redirects]]
  from = "/terminos-y-condiciones"
  to = "/terminos.html"
  status = 200

[[redirects]]
  from = "/politica-de-privacidad"
  to = "/privacidad.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/ayuda/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/cazadores/kit-5458c914/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
