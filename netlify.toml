[[redirects]]
  from = "/noticias"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/noticias/*"
  to = "/blog/:splat"
  status = 301

[[redirects]]
  from = "/terminos-y-condiciones"
  to = "/terminos.html"
  status = 200

[[redirects]]
  from = "/politica-de-privacidad"
  to = "/privacidad.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/guia-herramientas/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

